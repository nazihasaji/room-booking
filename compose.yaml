services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    restart: unless-stopped
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage

  web:
    build:
      context: .
      target: web
    depends_on:
      - app
    ports:
      - "${DOCKER_PORT:-8080}:80"
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage:ro
